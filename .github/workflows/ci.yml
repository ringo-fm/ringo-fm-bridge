name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # FoundationModels requires the macOS 26 SDK (Xcode 26 / Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Generate bridge files
        run: python3 tools/generate-bridge/generate.py
      - name: Check generated files are current
        run: git diff --exit-code
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
